<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missing Work</title>
<link rel="stylesheet" href="/static/panels/panel.css">
<style>
  .panel {
    --bg: #fffaf0;
    --ink: #2a2724;
    --title: #7a4f07;
    --muted: #a2967f;
    --rule: #eadcc2;
    --accent: #b8791a;
    background: linear-gradient(180deg, #fffdf8 0%, #fdf3e2 100%);
  }
  .p-row {
    grid-template-columns: minmax(0, 1fr) auto;
    --row-bg: #fff;
  }
  .p-row:nth-child(odd) { --row-bg: #fffdf9; }
  .p-stack { --c1: 8.5fr; --c2: 11fr; }
  .p-a { color: #33302a; }
  .p-b { color: #6d6459; }

  .age.fresh { background: #e8f2e3; color: #3f6b31; }
  .age.warm  { background: #fbeccb; color: #8a5d0c; }
  .age.late  { background: #fadfd5; color: #98371c; }

  @media (max-width: 300px) { .unit { display: none; } }

  .p-row.late  { --row-accent: #d1573a; }
  .p-row.warm  { --row-accent: #e0a12e; }
  .p-row.fresh { --row-accent: #7fae6b; }
</style>
</head>
<body>
<div class="panel">
  <div class="p-head">
    <div class="p-title">Missing work</div>
    <div class="p-sub" id="count"></div>
  </div>

  <div class="p-body" id="body"></div>

  <div class="p-foot">
    <span class="p-cta">Catch up during Advisory &middot; ask me for a pass</span>
    <span class="p-dots" id="dots"></span>
  </div>
</div>

<script src="/static/panels/panel.js"></script>
<script>
(function () {
  "use strict";

  /* Placeholder names in the same register as CanvasExpert's vault, so this
     demo board can never be mistaken for a real roster. */
  var MISSING = [
    { s: "Sparky McGee",       a: "Quick write: foreshadowing", d: 6 },
    { s: "Waffles Bergeron",   a: "Vocab quiz 3 retake",        d: 5 },
    { s: "Sparky McGee",       a: "Vocab quiz 3 retake",        d: 5 },
    { s: "Tuesday Halloran",   a: "The Landlady reading log",   d: 4 },
    { s: "Juniper Salt",       a: "Argument paragraph draft",   d: 4 },
    { s: "Dash Pennywhistle",  a: "Character map: Billy",       d: 3 },
    { s: "Clementine Fogg",    a: "Peer review form",           d: 3 },
    { s: "Ozzy Fairbanks",     a: "Sentence patterns practice", d: 2 },
    { s: "Marigold Vance",     a: "Book talk slides",           d: 2 },
    { s: "Rusty Ackerman",     a: "Independent reading check",  d: 2 },
    { s: "Tuesday Halloran",   a: "Peer review form",           d: 2 },
    { s: "Peach Delgado",      a: "Grammar gauntlet 5",         d: 1 },
    { s: "Bodhi Winterbottom", a: "Quick write: foreshadowing", d: 1 },
    { s: "Pepper Nakashima",   a: "Vocab quiz 3 retake",        d: 1 },
    { s: "Waffles Bergeron",   a: "Book talk slides",           d: 1 }
  ];

  MISSING.sort(function (a, b) { return b.d - a.d; });

  function band(d) { return d >= 4 ? "late" : (d >= 2 ? "warm" : "fresh"); }

  var roster = {};
  MISSING.forEach(function (m) { roster[m.s] = 1; });
  document.getElementById("count").innerHTML =
    MISSING.length + " items &middot; " + Object.keys(roster).length + " students";

  Panel.list({
    body:  document.getElementById("body"),
    dots:  document.getElementById("dots"),
    items: MISSING,
    every: 9000,
    render: function (m, row) {
      row.classList.add(band(m.d));

      var stack = document.createElement("span");
      stack.className = "p-stack";
      var who  = document.createElement("span");
      var what = document.createElement("span");
      who.className  = "p-a";
      what.className = "p-b";
      who.textContent  = m.s;
      what.textContent = m.a;
      stack.appendChild(who); stack.appendChild(what);

      /* the unit is the first thing to go when the panel gets tight: the
         number still reads, and "days" was never the information */
      var age = document.createElement("span");
      age.className = "p-pill age " + band(m.d);
      age.appendChild(document.createTextNode(String(m.d)));
      var unit = document.createElement("span");
      unit.className = "unit";
      unit.textContent = (m.d === 1 ? " day" : " days");
      age.appendChild(unit);

      row.appendChild(stack); row.appendChild(age);
    }
  });
})();
</script>
</body>
</html>
