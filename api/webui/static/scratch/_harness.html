<!doctype html>
<html><head><meta charset="utf-8"><title>panel harness</title>
<style>body{margin:0;background:#333;font:12px system-ui}#h{position:fixed;left:-9999px;top:0}</style>
</head><body><div id="h"></div>
<script>
/* Measure LEAF text elements only. Selecting `.p-row > *` silently measures
   wrapper divs once a panel nests its content, which reports the wrapper's
   inherited font-size rather than anything a human can actually read. */
function leaves(root) {
  var out = [];
  root.querySelectorAll("*").forEach(function (e) {
    if (e.children.length) return;
    if (!(e.textContent || "").trim()) return;
    if (!e.getClientRects().length) return;          /* hidden */
    out.push(e);
  });
  return out;
}

window.probe = function (page, w, h) {
  return new Promise(function (resolve) {
    var f = document.createElement("iframe");
    f.style.cssText = "width:" + w + "px;height:" + h + "px;border:0";
    /* cache-bust: stale _panel.css/_panel.js inside the frame silently
       invalidates every measurement taken here */
    f.src = "/static/scratch/" + page + ".html?cb=" + Date.now() + "-" + Math.random();
    document.getElementById("h").appendChild(f);
    f.onload = function () {
      setTimeout(function () {
        var d = f.contentDocument, win = f.contentWindow;
        var body = d.querySelector(".p-body");
        var compact = !body || !body.getClientRects().length;

        var rows = [].slice.call(d.querySelectorAll(".p-row:not(.p-row--ghost)"))
                     .filter(function (r) { return r.getClientRects().length; });

        var text = compact ? leaves(d.querySelector(".p-head"))
                           : rows.reduce(function (a, r) { return a.concat(leaves(r)); }, []);
        var sizes = text.map(function (e) { return parseFloat(getComputedStyle(e).fontSize); });
        var clipped = text.filter(function (e) { return e.scrollWidth > e.clientWidth + 1; });

        resolve({
          page: page, box: w + "x" + h,
          compact: compact,
          rows: compact ? 0 : rows.length,
          minText: sizes.length ? +Math.min.apply(null, sizes).toFixed(1) : 0,
          maxText: sizes.length ? +Math.max.apply(null, sizes).toFixed(1) : 0,
          clipped: clipped.length,
          clipSample: clipped.slice(0, 2).map(function (e) { return e.textContent.slice(0, 22); }),
          hOver: d.documentElement.scrollWidth - win.innerWidth,
          vOver: d.documentElement.scrollHeight - win.innerHeight
        });
        f.remove();
      }, 700);
    };
  });
};

/* A cache-buster on the frame URL does not help the shared assets: the
   panel's own <link href="_panel.css"> resolves without the query and comes
   straight from cache. Force-revalidate them so every frame below gets the
   file that is actually on disk. */
window.prime = function () {
  return Promise.all([
    fetch("/static/panels/panel.css", { cache: "reload" }),
    fetch("/static/panels/panel.js",  { cache: "reload" })
  ]);
};

window.sweep = function (pages, boxes) {
  var jobs = [];
  pages.forEach(function (p) { boxes.forEach(function (b) { jobs.push([p, b[0], b[1]]); }); });
  var out = [];
  return window.prime().then(function () { return jobs.reduce(function (chain, j) {
    return chain.then(function () {
      return window.probe(j[0], j[1], j[2]).then(function (r) { out.push(r); });
    });
  }, Promise.resolve()).then(function () { return out; }); });
};
</script>
</body></html>
