{% extends "layouts/display.html" %}
{% block title %}SmartDeck Display{% endblock %}
{% block display_body_class %}smartdeck-display-page{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="/static/smartdeck/display.css?v={{ asset_v }}">
{% endblock %}
{% block primary %}
<div id="sd-display-root" data-deck-id="{{ deck_id }}">
  <div id="sd-clock-skew-warning" class="sd-banner" hidden></div>
  <div id="sd-date-banner" class="sd-banner" hidden></div>
  <main id="sd-slide-stage" aria-live="polite"></main>
  <div id="sd-deck-widgets"></div>
  <div id="sd-not-scheduled" hidden></div>
  <div class="sd-corner-chrome">
    <button type="button" id="sd-shuffle" class="sd-chrome-btn" aria-pressed="false">Shuffle <span id="sd-shuffle-hint"></span></button>
    <button type="button" id="sd-home" class="sd-chrome-btn">Home</button>
    <button type="button" id="sd-maximize" class="sd-chrome-btn" title="Maximize">⛶</button>
    <button type="button" id="sd-minimize" class="sd-chrome-btn" title="Minimize" hidden>⤢</button>
    <button type="button" id="sd-close" class="sd-chrome-btn" title="Close">✕</button>
  </div>
</div>
{% endblock %}
{% block display_scripts %}
<script src="/static/smartdeck/slide_select.js?v={{ asset_v }}"></script>
<script src="/static/smartdeck/display.js?v={{ asset_v }}"></script>
{% endblock %}
