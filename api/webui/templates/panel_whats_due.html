<!doctype html>
<html lang="en" data-panel-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ panel_title }}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/panel.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/themes.css?v={{ asset_v }}">
<style>
  /* Structure and this panel's own mapping onto theme variables. No colour
     literals: a theme owns every one of them, and a value hardcoded here
     would survive theme switching and look broken in seven of eight skins. */
  .p-row {
    grid-template-columns: auto minmax(0, 1fr) auto;
    --row-bg: var(--row);
  }
  .p-row:nth-child(odd) { --row-bg: var(--row-alt, var(--row)); }

  .when {
    font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
    color: var(--when-ink, var(--muted));
    font-size: min(28cqh, 5cqw);
  }
  .p-a { color: var(--ink); }
  .pts { justify-self: end; background: var(--pill-bg); color: var(--pill-ink); }

  .p-row.today    { --row-bg: var(--today-bg); --row-accent: var(--today-accent); }
  .p-row.today .when { color: var(--today-ink); }
  .p-row.today .p-a  { font-weight: 800; color: var(--today-ink); }
  /* The secondary line keeps the muted colour everywhere except here: muted
     grey on a tinted today row is the one pairing that drops under 4.5:1. */
  .p-row.today .p-b  { color: var(--today-ink); }
  .p-row.tomorrow { --row-accent: var(--accent); }

  /* an empty panel is a normal state, not a failure: say the one useful
     thing large enough to read from the back of the room */
  .msg {
    flex: 1 1 auto; display: grid; place-items: center; text-align: center;
    padding: .4em 1em; color: var(--muted);
    /* clamped, not raw min(): on a wide short panel the vh term alone
       collapses this to a few pixels, which is the same mistake the row
       sizing in panel.css exists to avoid */
    font-size: clamp(14px, min(6vw, 16vh), 44px);
    font-weight: 600; line-height: 1.25;
  }
  /* An author display: rule beats the UA's [hidden] { display: none }, so
     without this the empty message box keeps its flex share and steals height
     from the rows. Invisible until a course actually has assignments, which
     is the one state that could not be observed before August. */
  .msg[hidden] { display: none; }
  .stale { color: var(--warn-ink, var(--muted)); }
</style>
</head>
<body>
<div class="panel">
  <div class="p-head">
    <div class="p-title" id="title">{{ panel_title }}</div>
    <div class="p-sub" id="sub"></div>
  </div>

  <div class="p-body" id="body"></div>
  <div class="msg" id="msg" hidden></div>

  <div class="p-foot">
    <span class="p-cta" id="foot"></span>
    <span class="p-dots" id="dots"></span>
  </div>
</div>

<script src="/static/panels/panel.js?v={{ asset_v }}"></script>
<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var course = params.get("course") || "";
  var days   = params.get("days") || "7";

  var bodyEl = document.getElementById("body");
  var msgEl  = document.getElementById("msg");
  var boundaryTimer = null;
  var DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function midnight(d) {
    var c = new Date(d.getTime()); c.setHours(0, 0, 0, 0); return c;
  }

  function whenLabel(due) {
    var delta = Math.round((midnight(due) - midnight(new Date())) / 86400000);
    if (delta <= 0) return "Today";
    if (delta === 1) return "Tomorrow";
    if (delta < 7)  return DAYS[due.getDay()];
    return (due.getMonth() + 1) + "/" + due.getDate();
  }

  function clockLabel(due) {
    var h = due.getHours(), m = due.getMinutes();
    var ampm = h >= 12 ? "pm" : "am";
    h = h % 12; if (h === 0) h = 12;
    return h + (m ? ":" + (m < 10 ? "0" : "") + m : "") + ampm;
  }

  function showMessage(text) {
    bodyEl.hidden = true;
    msgEl.hidden = false;
    msgEl.textContent = text;
  }

  /* Follow the bell. Without this the panel keeps last period's work on the
     wall until the next refresh lands, which is the whole point of following
     a schedule rather than a pinned course. */
  function atBoundary(hhmm) {
    clearTimeout(boundaryTimer);
    if (!hhmm) return;
    var parts = String(hhmm).split(":");
    var when = new Date();
    when.setHours(+parts[0], +parts[1], 20, 0);   /* just past the bell */
    var wait = when - new Date();
    if (wait > 0) boundaryTimer = setTimeout(load, wait);
  }

  function render(payload) {
    var sub = payload.course_name || payload.block || "";
    if (payload.relation === "next" && sub) sub = "Next · " + sub;
    document.getElementById("sub").textContent = sub;
    atBoundary(payload.next_change);

    if (payload.state !== "ready") {
      showMessage(payload.message || "Nothing to show.");
      document.getElementById("foot").textContent = "";
      return;
    }

    bodyEl.hidden = false;
    msgEl.hidden = true;
    document.getElementById("foot").textContent =
      "Next " + payload.days + " days";
    if (payload.stale) {
      document.getElementById("foot").classList.add("stale");
      document.getElementById("foot").textContent += " (catalog out of date)";
    }

    Panel.list({
      body:  bodyEl,
      dots:  document.getElementById("dots"),
      items: payload.assignments,
      every: 10000,
      render: function (a, row) {
        var due = new Date(a.due_at);
        var label = whenLabel(due);
        if (label === "Today") row.classList.add("today");
        else if (label === "Tomorrow") row.classList.add("tomorrow");

        var when = document.createElement("span");
        when.className = "when";
        when.textContent = label;

        var stack = document.createElement("span");
        stack.className = "p-stack";
        stack.style.setProperty("--c1", "13fr");
        stack.style.setProperty("--c2", "5fr");
        var title = document.createElement("span");
        var at = document.createElement("span");
        title.className = "p-a";
        at.className = "p-b";
        title.textContent = a.title;
        at.textContent = "due " + clockLabel(due);
        stack.appendChild(title); stack.appendChild(at);

        row.appendChild(when);
        row.appendChild(stack);

        if (a.points !== null && a.points !== undefined) {
          var pts = document.createElement("span");
          pts.className = "p-pill pts";
          pts.textContent = a.points + " pt" + (a.points === 1 ? "" : "s");
          row.appendChild(pts);
        } else {
          row.appendChild(document.createElement("span"));
        }
      }
    });
  }

  function load() {
    var url = "/panels/whats-due/data?course=" + encodeURIComponent(course) +
              "&days=" + encodeURIComponent(days);
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        showMessage("CanvasExpert is not running on this computer.");
      });
  }

  load();
  /* A projector panel is left up all period and across the bell. Re-read the
     local catalog occasionally so a refresh done mid-day shows up without
     the teacher touching the board. */
  setInterval(load, 15 * 60 * 1000);
})();
</script>
</body>
</html>
