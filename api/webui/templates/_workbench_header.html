{% set workbench_section = nav_section|default("") %}
<header class="topbar ce-workbench-header">
  <a class="brand" href="/">{% include "_ce_logo.svg" %} CanvasExpert</a>
  <nav aria-label="Workbench">
    <a class="ce-workbench-nav-link{% if request.url.path == '/' %} ce-workbench-nav-link--active{% endif %}" href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Desk</a>
    <a class="ce-workbench-nav-link{% if workbench_section == 'create' %} ce-workbench-nav-link--active{% endif %}" href="/course-expert"{% if workbench_section == 'create' %} aria-current="page"{% endif %}>Create</a>
    <a class="ce-workbench-nav-link{% if workbench_section == 'grade' %} ce-workbench-nav-link--active{% endif %}" href="/powergrader"{% if workbench_section == 'grade' %} aria-current="page"{% endif %}>Grade</a>
    <a class="ce-workbench-nav-link{% if workbench_section == 'manage' %} ce-workbench-nav-link--active{% endif %}" href="/roster"{% if workbench_section == 'manage' %} aria-current="page"{% endif %}>Students</a>
    <a class="ce-workbench-nav-link{% if workbench_section == 'automate' %} ce-workbench-nav-link--active{% endif %}" href="/routines"{% if workbench_section == 'automate' %} aria-current="page"{% endif %}>Automations</a>
  </nav>
  <div class="topbar-right">
    <a class="topbar-settings-link{% if workbench_section == 'settings' %} ce-workbench-nav-link--active{% endif %}" href="/settings"{% if workbench_section == 'settings' %} aria-current="page"{% endif %}>Settings</a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">
      <span class="toggle-track">
        <span class="toggle-thumb"></span>
        <span class="toggle-icon toggle-icon--sun">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </span>
        <span class="toggle-icon toggle-icon--moon">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</header>
