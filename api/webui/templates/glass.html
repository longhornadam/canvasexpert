{% extends "layouts/display.html" %}
{% block title %}Glass{% endblock %}
{% block display_body_class %}glass-page{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="/static/pages/glass.css?v={{ asset_v }}">
{% endblock %}
{% block primary %}
<div class="glass-frame" id="glass-frame">
  <header class="glass-header" aria-label="Glass status">
    <span class="glass-header__date" id="glass-date"></span>
    <span class="glass-header__clock" id="glass-clock"></span>
    <span class="glass-header__period" id="glass-period"></span>
    <span class="glass-header__course" id="glass-course"></span>
    <span class="glass-header__boundary" id="glass-boundary"></span>
    <span class="glass-header__simulated" id="glass-simulated" aria-label="SIMULATED" hidden>SIM</span>
  </header>

  <div class="glass-status" id="glass-status" hidden></div>

  <main class="glass-content" id="glass-content" aria-live="polite">
    <section class="glass-column" id="glass-left" aria-label="Class operations"></section>
    <section class="glass-column glass-column--instruction" id="glass-middle" aria-label="Instruction"></section>
    <section class="glass-column" id="glass-right" aria-label="School information"></section>
  </main>

  <footer class="glass-footer">
    <div class="glass-tools" aria-label="Glass tools">
      <button class="glass-tool" id="glass-random-button" aria-label="Random Name" type="button" data-tool="random" disabled>RANDOM NAME</button>
      <button class="glass-tool" type="button" data-tool="timer">TIMER <span id="glass-timer-footer"></span></button>
      <button class="glass-tool" type="button" data-tool="note">QUICK NOTE</button>
      <button class="glass-tool" type="button" data-tool="blank">BLANK</button>
    </div>
    <div class="glass-footer__status" id="glass-footer-status"></div>
  </footer>

  <div class="glass-tool-overlay" id="glass-tool-overlay" hidden>
    <div class="glass-tool-panel" id="glass-tool-random" data-panel="random" hidden>
      <div class="glass-tool-panel__label">RANDOM NAME</div>
      <div class="glass-tool-panel__value" id="glass-random-result" aria-live="polite">—</div>
      <button class="glass-action" id="glass-random-again" type="button">CHOOSE AGAIN</button>
      <button class="glass-action glass-action--quiet" type="button" data-close-tool>CLOSE</button>
    </div>
    <div class="glass-tool-panel" id="glass-tool-timer" data-panel="timer" hidden>
      <div class="glass-tool-panel__label">TIMER</div>
      <div class="glass-tool-panel__value glass-tool-panel__value--timer" id="glass-timer-value">5:00</div>
      <div class="glass-presets" aria-label="Timer duration">
        <button class="glass-action" type="button" data-timer-minutes="5">5 MIN</button>
        <button class="glass-action" type="button" data-timer-minutes="10">10 MIN</button>
        <button class="glass-action" type="button" data-timer-minutes="15">15 MIN</button>
      </div>
      <div class="glass-tool-panel__actions">
        <button class="glass-action" id="glass-timer-start" type="button">START</button>
        <button class="glass-action" id="glass-timer-pause" type="button">PAUSE</button>
        <button class="glass-action glass-action--quiet" id="glass-timer-reset" type="button">RESET</button>
        <button class="glass-action glass-action--quiet" type="button" data-close-tool>CLOSE</button>
      </div>
    </div>
    <div class="glass-tool-panel" id="glass-tool-note" data-panel="note" hidden>
      <div class="glass-tool-panel__label">QUICK NOTE</div>
      <textarea class="glass-note-input" id="glass-note-input" rows="3" maxlength="240" placeholder="Type a classroom note"></textarea>
      <div class="glass-tool-panel__actions">
        <button class="glass-action" id="glass-note-show" type="button">SHOW</button>
        <button class="glass-action glass-action--quiet" id="glass-note-hide" type="button">HIDE</button>
        <button class="glass-action glass-action--quiet" type="button" data-close-tool>CLOSE</button>
      </div>
    </div>
  </div>

  <div class="glass-note-overlay" id="glass-note-overlay" hidden>
    <div class="glass-note-overlay__text" id="glass-note-overlay-text"></div>
    <button class="glass-return" type="button" data-hide-note>HIDE NOTE</button>
  </div>
  <div class="glass-blank-overlay" id="glass-blank-overlay" hidden>
    <button class="glass-return" type="button" data-close-blank>RETURN TO GLASS</button>
  </div>
</div>
<script>window.GLASS_INITIAL = {{ payload|tojson }};</script>
{% endblock %}
{% block display_scripts %}
<script src="/static/pages/glass.js?v={{ asset_v }}"></script>
{% endblock %}
