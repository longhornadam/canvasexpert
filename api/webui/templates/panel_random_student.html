<!doctype html>
<html lang="en" data-panel-theme="{{ theme }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ panel_title }}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/panel.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/themes.css?v={{ asset_v }}">
<link rel="stylesheet" href="/panels/themes.css?theme={{ theme }}&v={{ asset_v }}">
<style>
.choice { flex: 1 1 auto; display: grid; place-items: center; text-align: center; color: var(--ink); font-size: clamp(28px, min(15vw, 30vh), 150px); font-weight: 850; line-height: 1.05; overflow: hidden; }
.choice[hidden], .panel-message[hidden] { display: none; }
.panel-message { flex: 1 1 auto; display: grid; place-items: center; text-align: center; padding: .4em 1em; color: var(--muted); font-size: clamp(14px, min(6vw, 16vh), 44px); font-weight: 600; line-height: 1.25; }
.pick { border: 0; border-radius: .25em; padding: .35em .7em; color: var(--pill-ink); background: var(--accent); font: inherit; font-size: clamp(14px, min(4vw, 7vh), 36px); font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<div class="panel">
  <div class="p-head"><div class="p-title">{{ panel_title }}</div><div class="p-sub" id="sub"></div></div>
  <div class="choice" id="choice" aria-live="polite">Pick a student</div>
  <div class="panel-message" id="msg" hidden></div>
  <div class="p-foot"><button type="button" class="pick" id="pick">Pick again</button><span class="p-cta" id="foot"></span></div>
</div>
<script src="/static/panels/panel.js?v={{ asset_v }}"></script>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search), block = params.get("block") || "";
  var choice = document.getElementById("choice"), msg = document.getElementById("msg");
  var pick = document.getElementById("pick"), names = [];
  function choose(length) {
    if (typeof window.CE_PANEL_RANDOM_CHOICE === "function") return window.CE_PANEL_RANDOM_CHOICE(length);
    if (window.crypto && window.crypto.getRandomValues) {
      var value = new Uint32Array(1); window.crypto.getRandomValues(value);
      return value[0] % length;
    }
    return Math.floor(Math.random() * length);
  }
  function showMessage(text) { choice.hidden = true; pick.hidden = true; msg.hidden = false; msg.textContent = text; }
  function showName() { if (names.length) { choice.hidden = false; msg.hidden = true; pick.hidden = false; choice.textContent = names[choose(names.length)]; } }
  function load() {
    fetch("/panels/random-student/data?block=" + encodeURIComponent(block), {cache: "no-store"})
      .then(function (r) { return r.json(); }).then(function (payload) {
        document.getElementById("sub").textContent = payload.block || "";
        if (payload.state !== "ready") { names = []; showMessage(payload.message || "No students to choose from."); return; }
        names = payload.names || []; showName();
      }).catch(function () { showMessage("CanvasExpert is not running on this computer."); });
  }
  pick.addEventListener("click", showName); load(); setInterval(load, 15 * 60 * 1000);
}());
</script>
</body>
</html>
