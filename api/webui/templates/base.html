<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Canvas Expert{% endblock %}</title>
  <!-- Prevent flash of wrong theme -->
  <script>try{var t=localStorage.getItem('ce-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <!-- Local fonts (vendored from Google Fonts) -->
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body class="{% if nav_section %}nav-section-{{ nav_section }} {% endif %}{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">{% include "_ce_logo.svg" %} CanvasExpert</a>
    <nav>
      <a class="nav-link nav-course{% if nav_section == 'course' %} nav-active{% endif %}" href="/course-expert">Course Expert</a>
      <a class="nav-link nav-roster{% if nav_section == 'roster' %} nav-active{% endif %}" href="/roster">Roster</a>
      <a class="nav-link nav-gradebook{% if nav_section == 'gradebook' %} nav-active{% endif %}" href="/gradebook">Gradebook Expert</a>
      <a class="nav-link nav-ai{% if nav_section == 'ai' %} nav-active{% endif %}" href="/ai-expert">AI Expert</a>
      <a class="nav-link nav-feedback{% if nav_section == 'feedback' %} nav-active{% endif %}" href="/feedback-expert">Feedback Expert</a>
    </nav>
    <div class="topbar-right">
      <a href="/settings" class="topbar-settings-link">Settings</a>
      <a href="/about" class="topbar-settings-link{% if nav_section == 'about' %} topbar-right-active{% endif %}">About</a>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
          <span class="toggle-icon toggle-icon--sun">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </span>
          <span class="toggle-icon toggle-icon--moon">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </span>
      </button>
    </div>
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div id="ce-toast" class="ce-toast" hidden></div>
  <script>
  (function(){
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function(){
      var html = document.documentElement;
      html.classList.add('ce-transitioning');
      var dark = html.getAttribute('data-theme') !== 'dark';
      html.setAttribute('data-theme', dark ? 'dark' : 'light');
      try { localStorage.setItem('ce-theme', dark ? 'dark' : 'light'); } catch(e){}
      setTimeout(function(){ html.classList.remove('ce-transitioning'); }, 320);
    });
  })();
  // Nav dropdown: close all when another opens or user clicks outside
  (function(){
    var dds = Array.from(document.querySelectorAll('.nav-dd'));
    dds.forEach(function(dd) {
      dd.addEventListener('toggle', function() {
        if (dd.open) {
          dds.forEach(function(other) { if (other !== dd) other.open = false; });
        }
      });
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-dd')) {
        dds.forEach(function(dd) { dd.open = false; });
      }
    });
    // Activate nav section anchor on page load
    var hash = location.hash;
    if (hash) {
      var el = document.querySelector(hash);
      if (el) { setTimeout(function(){ el.scrollIntoView({behavior:'smooth'}); }, 80); }
    }
  })();
  // Toast + open-path: clicking any [data-open-path] reveals the file/folder in the
  // OS file manager (local app only). Available on every page.
  (function(){
    var t = document.getElementById('ce-toast');
    window.ceToast = function(msg, isErr){
      if (!t) return;
      t.textContent = msg;
      t.className = 'ce-toast' + (isErr ? ' err' : '');
      t.hidden = false;
      clearTimeout(t._h);
      t._h = setTimeout(function(){ t.hidden = true; }, 2600);
    };
    document.addEventListener('click', function(e){
      var el = e.target.closest('[data-open-path]');
      if (!el) return;
      e.preventDefault();
      var path = el.getAttribute('data-open-path');
      fetch('/api/open-path', {method:'POST', body:new URLSearchParams({path:path})})
        .then(function(r){ return r.json(); })
        .then(function(d){ if (!d.ok) window.ceToast('Could not open: ' + (d.error || 'unknown'), true); })
        .catch(function(){ window.ceToast('Could not open path', true); });
    });
  })();
  </script>
</body>
</html>
