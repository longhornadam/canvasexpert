<section class="card tool-course-card ce-course-work-card">
  <div class="tool-course-card-head">
    <div>
      <h2>Target courses</h2>
      <p class="hint">Choose the focused course for Canvas-specific options. Checked courses receive pushes.</p>
    </div>
    <div class="ce-course-row">
      <details class="ce-course-picker" id="ce-course-picker">
        <summary class="ce-picker-trigger">
          <span id="ce-picker-label">— pick courses —</span>
          <span class="ce-picker-caret">▾</span>
        </summary>
        <div class="ce-picker-pop">
          <div class="ce-picker-head">
            Target courses <span id="target-count" class="cc-count"></span>
          </div>
          <div id="course-checklist" class="course-checklist">
            {% for c in saved_courses %}
            <div class="cc-row" data-id="{{ c.id }}" data-name="{{ c.name }}">
              <input type="checkbox" class="cc-cb" value="{{ c.id }}" data-name="{{ c.name }}">
              <span class="cc-star" title="Bookmarked">★</span>
              <button type="button" class="cc-focus" title="Focus this course">{{ c.nickname }}</button>
            </div>
            {% endfor %}
            {% if not saved_courses %}
            <p class="hint" style="font-size:13px; margin:0">
              No bookmarked courses yet. <a href="/settings">Add some in Settings</a>.
            </p>
            {% endif %}
          </div>
          <div id="ci-targets" class="ci-targets" hidden></div>
          <div class="ce-picker-links">
            <a href="/course" class="small-link">Course info ↗</a>
            <a href="/settings" class="small-link">Manage ↗</a>
          </div>
        </div>
      </details>
    </div>
  </div>
</section>
