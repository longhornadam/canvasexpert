<!doctype html>
<html lang="en" data-panel-theme="{{ theme }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ panel_title }}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/panel.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/themes.css?v={{ asset_v }}">
<link rel="stylesheet" href="/panels/themes.css?theme={{ theme }}&v={{ asset_v }}">
<style>
.p-row { grid-template-columns: minmax(0, 1fr) auto; --row-bg: var(--row); }
.p-row:nth-child(odd) { --row-bg: var(--row-alt, var(--row)); }
.p-a { color: var(--ink); }
.p-b { color: var(--muted); }
.count { justify-self: end; color: var(--pill-ink); background: var(--pill-bg); }
.msg { flex: 1 1 auto; display: grid; place-items: center; text-align: center; padding: .4em 1em; color: var(--muted); font-size: clamp(14px, min(6vw, 16vh), 44px); font-weight: 600; line-height: 1.25; }
.msg[hidden] { display: none; }
</style>
</head>
<body>
<div class="panel">
  <div class="p-head"><div class="p-title">{{ panel_title }}</div><div class="p-sub" id="sub"></div></div>
  <div class="p-body" id="body"></div><div class="msg" id="msg" hidden></div>
  <div class="p-foot"><span class="p-cta" id="foot"></span><span class="p-dots" id="dots"></span></div>
</div>
<script src="/static/panels/panel.js?v={{ asset_v }}"></script>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search), block = params.get("block") || "";
  var body = document.getElementById("body"), msg = document.getElementById("msg");
  function show(text) { body.hidden = true; msg.hidden = false; msg.textContent = text; }
  function render(payload) {
    document.getElementById("sub").textContent = payload.block || "";
    if (payload.state !== "ready") { show(payload.message || "No missing work."); document.getElementById("foot").textContent = ""; return; }
    body.hidden = false; msg.hidden = true; document.getElementById("foot").textContent = "Current roster";
    Panel.list({body: body, dots: document.getElementById("dots"), items: payload.students, every: 10000,
      render: function (item, row) {
        var stack = document.createElement("span"); stack.className = "p-stack"; stack.style.setProperty("--c1", "8fr"); stack.style.setProperty("--c2", "12fr");
        var name = document.createElement("span"); name.className = "p-a"; name.textContent = item.student_name;
        var titles = document.createElement("span"); titles.className = "p-b"; titles.textContent = (item.assignment_titles || []).join(", ");
        stack.appendChild(name); stack.appendChild(titles);
        var count = document.createElement("span"); count.className = "p-pill count"; count.textContent = String(item.missing_count);
        row.appendChild(stack); row.appendChild(count);
      }});
  }
  function load() { fetch("/panels/missing-work/data?block=" + encodeURIComponent(block), {cache: "no-store"}).then(function (r) { return r.json(); }).then(render).catch(function () { show("CanvasExpert is not running on this computer."); }); }
  load(); setInterval(load, 15 * 60 * 1000);
}());
</script>
</body>
</html>
