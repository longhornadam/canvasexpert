<div id="ce-readiness-strip" class="ce-status-strip" data-status="unknown" aria-live="polite">
  <span class="ce-status-item ce-readiness-label">Readiness</span>
  <span class="ce-status-item" data-readiness-component="canvas">
    <span class="ce-status-dot" data-readiness-dot="canvas"></span>Canvas <strong data-readiness-value="canvas">Unknown</strong>
  </span>
  <span class="ce-status-item" data-readiness-component="openrouter">
    <span class="ce-status-dot" data-readiness-dot="openrouter"></span>Model <strong data-readiness-value="openrouter">Unknown</strong>
  </span>
  <span class="ce-status-item" data-readiness-component="privacy">
    <span class="ce-status-dot" data-readiness-dot="privacy"></span>Privacy <strong data-readiness-value="privacy">Unknown</strong>
  </span>
  <button type="button" class="ce-readiness-refresh" data-readiness-refresh hidden>Refresh</button>
  <details class="ce-readiness-details" data-readiness-details hidden>
    <summary>Readiness details</summary>
    <span data-readiness-detail></span>
  </details>
</div>
