<!doctype html>
<html lang="en" data-panel-theme="{{ theme }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ panel_title }}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/panel.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/panels/themes.css?v={{ asset_v }}">
<link rel="stylesheet" href="/panels/themes.css?theme={{ theme }}&v={{ asset_v }}">
<style>
.choice { flex: 1 1 auto; display: grid; place-items: center; text-align: center; color: var(--ink); font-size: clamp(28px, min(15vw, 30vh), 150px); font-weight: 850; line-height: 1.05; overflow: hidden; }
.choice[hidden], .panel-message[hidden] { display: none; }
.panel-message { flex: 1 1 auto; display: grid; place-items: center; text-align: center; padding: .4em 1em; color: var(--muted); font-size: clamp(14px, min(6vw, 16vh), 44px); font-weight: 600; line-height: 1.25; }
.pick, .reset { border: 0; border-radius: .25em; padding: .35em .7em; color: var(--pill-ink); background: var(--accent); font: inherit; font-size: clamp(14px, min(4vw, 7vh), 36px); font-weight: 800; cursor: pointer; }
.reset { background: var(--rule); color: var(--ink); }
</style>
</head>
<body>
<div class="panel">
  <div class="p-head"><div class="p-title">{{ panel_title }}</div><div class="p-sub" id="sub"></div></div>
  <div class="choice" id="choice" aria-live="polite">Pick next</div>
  <div class="panel-message" id="msg" hidden></div>
  <div class="p-foot"><button type="button" class="pick" id="pick" hidden>Pick next</button><button type="button" class="reset" id="reset" hidden>Reset</button><span class="p-cta" id="foot"></span></div>
</div>
<script src="/static/panels/panel.js?v={{ asset_v }}"></script>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search), block = params.get("block") || "";
  var choice = document.getElementById("choice"), msg = document.getElementById("msg");
  var pick = document.getElementById("pick"), reset = document.getElementById("reset");
  var names = [], used = [], storageKey = "";
  function setStorageKey(value) { storageKey = "ce.panel.random-student-no-repeats.v1." + encodeURIComponent(value || "follow"); }
  function choose(length) {
    if (typeof window.CE_PANEL_RANDOM_CHOICE === "function") return window.CE_PANEL_RANDOM_CHOICE(length);
    if (window.crypto && window.crypto.getRandomValues) { var value = new Uint32Array(1); window.crypto.getRandomValues(value); return value[0] % length; }
    return Math.floor(Math.random() * length);
  }
  /* The bag is keyed by the block the payload resolved to, so there is no key
     to read or write until the first payload arrives. Guarding here keeps a
     click during that window from writing a bag under the empty key. */
  function readState() {
    if (!storageKey) return {};
    try { var raw = JSON.parse(localStorage.getItem(storageKey) || "null"); if (raw && typeof raw === "object") return raw; } catch (e) {}
    return {};
  }
  function saveState() {
    if (!storageKey) return;
    try { localStorage.setItem(storageKey, JSON.stringify({names: names, used: used})); } catch (e) {}
  }
  function showMessage(text) { choice.hidden = true; msg.hidden = false; msg.textContent = text; }
  function available() { return names.filter(function (name) { return used.indexOf(name) < 0; }); }
  /* Both controls start hidden and only appear once a payload has resolved a
     roster: a Pick or Reset before that has no cycle to act on. Reset stays
     visible once the cycle is exhausted, because that is when it is needed. */
  function render() {
    var left = available();
    if (!names.length) { showMessage("No students to choose from."); pick.hidden = true; reset.hidden = true; return; }
    reset.hidden = false;
    if (!left.length) { showMessage("Everyone has been selected"); pick.hidden = true; return; }
    choice.hidden = false; msg.hidden = true; pick.hidden = false;
  }
  function pickNext() {
    var left = available(); if (!left.length) { render(); return; }
    var name = left[choose(left.length)]; used.push(name); choice.textContent = name; saveState(); render();
  }
  function resetCycle() { used = []; saveState(); choice.textContent = "Pick next"; pick.hidden = false; msg.hidden = true; choice.hidden = false; }
  function load() {
    fetch("/panels/random-student-no-repeats/data?block=" + encodeURIComponent(block), {cache: "no-store"})
      .then(function (r) { return r.json(); }).then(function (payload) {
        document.getElementById("sub").textContent = payload.block || "";
        if (payload.state !== "ready") { names = []; showMessage(payload.message || "No students to choose from."); pick.hidden = true; reset.hidden = true; return; }
        setStorageKey(payload.block || block || "follow");
        names = (payload.names || []).slice();
        var old = readState(), oldUsed = Array.isArray(old.used) ? old.used : [];
        used = oldUsed.filter(function (name) { return names.indexOf(name) >= 0; });
        saveState(); render();
      }).catch(function () { showMessage("CanvasExpert is not running on this computer."); pick.hidden = true; reset.hidden = true; });
  }
  pick.addEventListener("click", pickNext); reset.addEventListener("click", resetCycle); load(); setInterval(load, 15 * 60 * 1000);
}());
</script>
</body>
</html>
